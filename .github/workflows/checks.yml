name: checks

on:
  push:
  pull_request:

jobs:
  playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        run: python3 -m unittest discover -s tests -v
      - name: structure
        run: python3 ai-dev-playbook/scripts/playbook.py check --ready
